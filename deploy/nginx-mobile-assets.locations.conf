    location = /harness-mobile-nav.js {
      alias /etc/nginx/harness-mobile-nav.js;
      default_type application/javascript;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # 「添加到主屏幕」图标与清单：上游 manifest 只声明了 SVG 图标，
    # iOS 主屏图标不支持 SVG，Android 自适应图标也需要 PNG 安全区版本。
    location = /manifest.webmanifest {
      alias /etc/nginx/harness-manifest.webmanifest;
      default_type application/manifest+json;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ^~ /harness-icons/ {
      alias /etc/nginx/harness-icons/;
      add_header Cache-Control "public, max-age=3600" always;
    }
