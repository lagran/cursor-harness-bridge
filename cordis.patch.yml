# Disable the default model loop, then mount the Cursor factory as its own row.
# Harness intentionally rejects changing an existing row's plugin name.
- id: agent-loop
  disabled: true

- insert:
  - id: cursor-agent-factory
    name: 'cursor-harness-bridge'
    config:
      apiKeyEnv: CURSOR_API_KEY
      defaultModel: !!js process.env.CURSOR_MODEL ?? 'auto'
      stateDir: !!js process.env.CURSOR_BRIDGE_STATE_DIR
      settingSources: !!js "process.env.CURSOR_SETTING_SOURCES ? process.env.CURSOR_SETTING_SOURCES.split(',') : []"
      additionalDirs: !!js "process.env.CURSOR_ADDITIONAL_DIRS ? process.env.CURSOR_ADDITIONAL_DIRS.split(',') : []"
      modelCacheMs: 60000
      workspaceScanCacheMs: !!js "Number(process.env.CURSOR_WORKSPACE_SCAN_CACHE_MS ?? 300000)"
      runStallMs: !!js "Number(process.env.CURSOR_RUN_STALL_MS ?? 90000)"

- id: agent-default-model
  config:
    provider: cursor-agent
    model: !!js process.env.CURSOR_MODEL ?? 'auto'

# These routes would select an LLM, but this profile deliberately selects a
# complete Cursor Agent runtime. Keeping both would make the model picker
# promise combinations the custom factory cannot execute.
- id: llm-deepseek
  disabled: true

- id: llm-pi-ai
  disabled: true

- id: web-search-deepseek
  disabled: true

# Cursor owns the model loop, but the Harness permission surface remains
# enabled because the bridge maps its per-session policy into Cursor options.
- id: ui-plan
  disabled: true

# The Cursor catalog adapter intentionally cannot perform auxiliary raw LLM
# requests, so use the deterministic first-prompt title fallback.
- id: session-title-llm
  disabled: true
